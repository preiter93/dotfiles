set-environment -g PATH "/opt/homebrew/bin:/bin:/usr/bin"
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

thm_bg="#06172B"
thm_fg="#D9DDD9"
thm_red="#C87559"
thm_green="#8FB8A5"
thm_yellow="#E8B66F"
thm_blue="#537FA8"
thm_magenta="#9B89B8"
thm_cyan="#72BDB8"
thm_black="#354657"
thm_white="#FFF1D9"
thm_orange="#EF9278"

unbind r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
set -g escape-time 0
set -g history-limit 1000000
setw -g mode-keys vi
set -g mode-style "fg=#FFF1D9,bg=#354657"
set -g @tpm-clean 'u'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'

set -g status on

set -g status-position bottom
set -g status-style "fg=#D9DDD9,bg=#06172B"
set -g status-justify left

# Left: session name
set -g status-left ""
set -g status-left-length 0

# Windows
set -g window-status-separator ""
set -g window-status-format "#[fg=#D9DDD9,bg=#06172B] #I:#W "
set -g window-status-current-format "#[fg=#06172B,bg=#E8B66F,bold] #I:#W #[fg=#E8B66F,bg=#06172B]"

# Right: application and clock
set -g status-right-length 60
set -g status-right "#[fg=#354657,bg=#06172B]#[fg=#FFF1D9,bg=#354657] %H:%M "

unbind %
unbind '"'
bind - split-window -h -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind S command-prompt -p "New Session:" "new-session -A -s '%%'"

unbind-key -T copy-mode-vi Space
unbind-key -T copy-mode-vi Enter
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "reattach-to-user-namespace pbcopy"
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

run -b '~/.tmux/plugins/tpm/tpm'
